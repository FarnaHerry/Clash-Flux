import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.BuildConfigField
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import javax.inject.Inject
import java.security.MessageDigest
import java.util.zip.GZIPInputStream

plugins {
    alias(libs.plugins.android.application)
}

abstract class StageHuxerUIAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getPackageDirectories()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        def resourcePackage = packageDirectories.files.find { new File(it, "huxerui/resources.bin").isFile() }
        if (resourcePackage == null) {
            throw new GradleException("HuxerUI resource package is missing from the built Android ABIs")
        }
        fileSystemOperations.sync {
            from resourcePackage
            into outputDirectory
        }
    }
}

abstract class StageMihomoJniLibs extends DefaultTask {
    @Input
    abstract ListProperty<String> getAbis()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    private static final String MIHOMO_VERSION = "v1.19.30"
    private static final String MIHOMO_BASE_URL =
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}"
    private static final Map<String, Map<String, String>> MIHOMO_ASSETS = [
            "arm64-v8a": [
                    name: "mihomo-android-arm64-v8-${MIHOMO_VERSION}.gz",
                    sha256: "19afeb40fca190fc2e3906a4e3b87c74a0c2120626fd3cb3ae0cf4092cb780ad"
            ],
            "x86_64": [
                    name: "mihomo-android-amd64-${MIHOMO_VERSION}.gz",
                    sha256: "33aa898cb17b442531abbb9f7567e0e4a8e0542ee2f72f042b1a805f0b6ab1fe"
            ],
            "armeabi-v7a": [
                    name: "mihomo-android-armv7-${MIHOMO_VERSION}.gz",
                    sha256: "cfdd1fee92408da09666aa3845fbf73727359b72b6eb4bf69785a21bddb28ec1"
            ],
            "x86": [
                    name: "mihomo-android-386-${MIHOMO_VERSION}.gz",
                    sha256: "4fc9a2fa45f93d4bb1ae055157c67ba401890a80f23d60fa2d2b542b774fdfca"
            ]
    ]

    @TaskAction
    void stage() {
        def output = outputDirectory.get().asFile
        project.delete(output)
        output.mkdirs()

        abis.get().each { abi ->
            def asset = MIHOMO_ASSETS[abi]
            if (asset == null) {
                throw new GradleException("No mihomo Android asset is configured for ABI ${abi}")
            }

            def archive = new File(temporaryDir, asset.name)
            if (!archive.parentFile.exists()) archive.parentFile.mkdirs()
            def connection = new URL("${MIHOMO_BASE_URL}/${asset.name}").openConnection()
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000
            connection.inputStream.withCloseable { input ->
                archive.withOutputStream { fileOutput ->
                    fileOutput << input
                }
            }

            def digest = MessageDigest.getInstance("SHA-256")
            archive.withInputStream { input ->
                def buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    if (count > 0) digest.update(buffer, 0, count)
                }
            }
            def actualSha256 = digest.digest().collect { String.format("%02x", it & 0xff) }.join()
            if (actualSha256 != asset.sha256) {
                throw new GradleException(
                        "mihomo ${asset.name} SHA-256 mismatch: ${actualSha256}")
            }

            // Android SELinux forbids execute_no_trans for app_data_file. Put
            // the official engine in the APK's prebuilt JNI library set so
            // PackageManager extracts it into nativeLibraryDir, whose file
            // labeling permits an app to execute it.
            def binary = new File(output, "${abi}/libmihomo.so")
            binary.parentFile.mkdirs()
            new GZIPInputStream(archive.newInputStream()).withCloseable { input ->
                binary.withOutputStream { fileOutput ->
                    fileOutput << input
                }
            }
            if (!binary.setExecutable(true, false)) {
                throw new GradleException("Unable to mark staged mihomo executable: ${binary}")
            }
        }
    }
}

def huxeruiProperty = { String name -> providers.gradleProperty(name).get() }
def huxeruiHome = rootProject.gradle.ext.huxeruiHome
def huxeruiLibraries = rootProject.gradle.ext.huxeruiLibraries
def huxeruiCompileSdk = huxeruiProperty("huxeruiCompileSdk").toInteger()
def huxeruiMinSdk = huxeruiProperty("huxeruiMinSdk").toInteger()
def huxeruiTargetSdk = huxeruiProperty("huxeruiTargetSdk").toInteger()
def huxeruiNdkVersion = huxeruiProperty("huxeruiNdkVersion")
def huxeruiAbis = huxeruiProperty("huxeruiAbis").split(",")
def huxeruiStl = huxeruiProperty("huxeruiStl")
def releaseKeystoreFile = providers.gradleProperty("clashfluxReleaseKeystoreFile").orNull
def releaseKeystorePassword = providers.gradleProperty("clashfluxReleaseKeystorePassword").orNull
def releaseKeyAlias = providers.gradleProperty("clashfluxReleaseKeyAlias").orNull
def releaseKeyPassword = providers.gradleProperty("clashfluxReleaseKeyPassword").orNull
def requireReleaseSigning = providers.gradleProperty("clashfluxRequireReleaseSigning")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def hasReleaseSigning = [releaseKeystoreFile, releaseKeystorePassword, releaseKeyAlias,
                         releaseKeyPassword].every { it != null && !it.isEmpty() }

if (requireReleaseSigning && !hasReleaseSigning) {
    throw new GradleException(
            "Release signing is required; provide clashfluxReleaseKeystoreFile, " +
                    "clashfluxReleaseKeystorePassword, clashfluxReleaseKeyAlias, " +
                    "and clashfluxReleaseKeyPassword")
}

if (hasReleaseSigning && !file(releaseKeystoreFile).isFile()) {
    throw new GradleException("Android release keystore does not exist: ${releaseKeystoreFile}")
}

android {
    buildFeatures {
        buildConfig = true
    }

    namespace = "dev.farna.clashflux"
    compileSdk = huxeruiCompileSdk
    ndkVersion = huxeruiNdkVersion

    defaultConfig {
        applicationId = "dev.farna.clashflux"
        minSdk = huxeruiMinSdk
        targetSdk = huxeruiTargetSdk
        versionCode = 16
        versionName = "0.1.16"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=${huxeruiStl}",
                        "-DHUXERUI_HOME=${huxeruiHome.absolutePath}"
            }
        }

        ndk {
            abiFilters(*huxeruiAbis)
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path = file("../../../CMakeLists.txt")
            version = "3.31.6"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseKeystoreFile)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Local builds use the generated debug key. CI passes a stable
            // release keystore through Gradle project properties.
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // The bundled mihomo is an executable packaged under lib/<abi>, not a
    // library loaded by System.loadLibrary. Force JNI extraction so Android
    // places it in nativeLibraryDir, whose SELinux label permits execution.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def integrationRoot = layout.buildDirectory.dir("generated/huxerui/integration/${variant.name}").get().asFile
    variant.externalNativeBuild.arguments.add("-DHUXERUI_ANDROID_APP_INTEGRATION_ROOT=${integrationRoot.absolutePath}")
    def resourceRoot = layout.buildDirectory.dir("generated/huxerui/resources/${variant.name}").get().asFile
    variant.externalNativeBuild.arguments.add("-DHUXERUI_ANDROID_RESOURCE_OUTPUT_ROOT=${resourceRoot.absolutePath}")
    def nativeLibraries = variant.artifacts.get(SingleArtifact.MERGED_NATIVE_LIBS.INSTANCE)
    def packagedAbis = nativeLibraries.map { directory ->
        new File(directory.asFile, "lib").listFiles()?.findAll { it.isDirectory() }?.sort { it.name } ?: []
    }
    def libraryFile = layout.buildDirectory.file("generated/huxerui/app-library/${variant.name}.txt").get().asFile
    def resolveLibrary = tasks.register("resolveHuxerUI${variant.name.capitalize()}AppLibrary") {
        inputs.dir(nativeLibraries)
        inputs.dir(integrationRoot)
        outputs.file(libraryFile)
        doLast {
            def applications = packagedAbis.get().collect { abiDirectory ->
                def planFile = new File(integrationRoot, "${abiDirectory.name}/app.json")
                if (!planFile.isFile()) {
                    throw new GradleException("HuxerUI application integration plan is missing: ${planFile}")
                }
                def plan = new JsonSlurper().parse(planFile)
                if (plan.schema != 1 || !(plan.target instanceof String) || !(plan.artifact instanceof String)) {
                    throw new GradleException("HuxerUI application integration plan is invalid: ${planFile}")
                }
                def fileName = new File(plan.artifact).name
                if (!fileName.startsWith("lib") || !fileName.endsWith(".so") || fileName.length() <= 6) {
                    throw new GradleException("HuxerUI application artifact must be a lib<name>.so file: ${plan.artifact}")
                }
                def libraryName = fileName.substring(3, fileName.length() - 3)
                if (libraryName == "huxerui") {
                    throw new GradleException("HuxerUI application library must not use the framework name huxerui")
                }
                if (!new File(abiDirectory, fileName).isFile()) {
                    throw new GradleException("HuxerUI application library is missing for ${abiDirectory.name}: ${fileName}")
                }
                return [target: plan.target, library: libraryName]
            }.unique()
            if (applications.size() != 1) {
                throw new GradleException("HuxerUI application target and library name must match across Android ABIs")
            }
            libraryFile.parentFile.mkdirs()
            libraryFile.setText(applications[0].library, "UTF-8")
        }
    }
    variant.buildConfigFields.put("HUXERUI_APP_LIBRARY", resolveLibrary.map { task ->
        new BuildConfigField("String", JsonOutput.toJson(task.outputs.files.singleFile.getText("UTF-8")),
                "Application library resolved from the CMake target.")
    })

    def stageAssets = tasks.register("stageHuxerUI${variant.name.capitalize()}Assets", StageHuxerUIAssets) {
        packageDirectories.from(packagedAbis.map { directories ->
            directories.collect { new File(resourceRoot, "${it.name}/package") }
        })
    }
    variant.sources.assets.addGeneratedSourceDirectory(stageAssets) { it.outputDirectory }

    def stageMihomo = tasks.register("stageMihomo${variant.name.capitalize()}JniLibs", StageMihomoJniLibs) {
        abis.set(huxeruiAbis.toList())
        outputDirectory.set(layout.buildDirectory.dir("generated/mihomo/jniLibs/${variant.name}"))
    }
    variant.sources.jniLibs.addGeneratedSourceDirectory(stageMihomo) { it.outputDirectory }
}

dependencies {
    if (rootProject.gradle.ext.huxeruiUsesSource) {
        implementation project(":HuxerUI")
    } else {
        implementation files(rootProject.gradle.ext.huxeruiAndroidArchive)
    }
    huxeruiLibraries.each { library ->
        implementation project(library.projectPath)
    }
}
