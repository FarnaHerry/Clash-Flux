  <path d="M100 324C109 344 118 353 129 361C145 405 191 425 256 428C321 425 367 405 383 361C394 353 403 344 412 324"
        fill="none" stroke="#26398d" stroke-width="8" stroke-linecap="round"/>

  <!-- Forehead highlight -->
