<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Clash-Flux logo</title>
  <desc id="desc">A rounded midnight-blue cat face with cyan eyes, ears, and a small wave-shaped mouth.</desc>
  <defs>
    <linearGradient id="ear" x1="92" y1="100" x2="240" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252b49"/>
      <stop offset="1" stop-color="#111527"/>
    </linearGradient>
    <linearGradient id="face" x1="126" y1="192" x2="384" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b314e"/>
      <stop offset="0.52" stop-color="#1b2038"/>
      <stop offset="1" stop-color="#111526"/>
    </linearGradient>
    <linearGradient id="edge" x1="116" y1="128" x2="412" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8c8ff"/>
      <stop offset="0.38" stop-color="#6f83de"/>
      <stop offset="0.72" stop-color="#3a63e0"/>
      <stop offset="1" stop-color="#192a86"/>
    </linearGradient>
    <linearGradient id="cyan" x1="170" y1="174" x2="336" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9be6ff"/>
      <stop offset="1" stop-color="#55bff1"/>
