  <path d="M143 238C132 203 135 157 148 130C174 135 213 153 242 179L224 207C194 207 168 217 143 238Z"
        fill="url(#cyan)"/>
  <path d="M369 238C380 203 377 157 364 130C338 135 299 153 270 179L288 207C318 207 344 217 369 238Z"
        fill="url(#cyan)"/>
  <path d="M127 132C143 105 166 108 204 124C231 135 252 148 270 164"
        fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
  <path d="M385 132C369 105 346 108 308 124C281 135 260 148 242 164"
        fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>

  <!-- Head -->
  <path d="M107 295C116 232 170 190 256 190C342 190 396 232 405 295C415 307 424 316 432 321C424 340 413 351 402 359C387 403 337 438 256 440C175 438 125 403 110 359C99 351 88 340 80 321C88 316 97 307 107 295Z"
