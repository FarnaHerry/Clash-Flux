  <path d="M448 296C464 263 466 206 462 151C458 97 441 70 407 70C363 70 310 105 267 148L293 207C348 215 403 247 448 296Z"
        fill="url(#ear)" stroke="#0d1223" stroke-width="11" stroke-linejoin="round"/>
  <path d="M96 257C81 220 83 158 95 111C125 117 163 140 197 171C158 189 123 219 96 257Z"
        fill="url(#cyan)"/>
  <path d="M416 257C431 220 429 158 417 111C387 117 349 140 315 171C354 189 389 219 416 257Z"
        fill="url(#cyan)"/>
  <path d="M65 127C72 88 87 83 109 84C150 90 191 115 230 151"
        fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
  <path d="M447 127C440 88 425 83 403 84C362 90 321 115 282 151"
        fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>

  <!-- Head -->
  <path d="M78 280C91 196 160 151 256 151C352 151 421 196 434 280C441 306 450 329 466 346C451 369 433 386 411 396C391 427 336 445 256 445C176 445 121 427 101 396C79 386 61 369 46 346C62 329 71 306 78 280Z"
        fill="url(#face)" stroke="#0b1020" stroke-width="12" stroke-linejoin="round"/>
  <path d="M83 278C96 199 163 163 256 163C349 163 416 199 429 278"
        fill="none" stroke="url(#edge)" stroke-width="9" stroke-linecap="round"/>
  <path d="M62 350C76 369 89 380 102 389C120 423 177 438 256 439C335 438 392 423 410 389C423 380 436 369 450 350"
        fill="none" stroke="#26398d" stroke-width="8" stroke-linecap="round"/>

  <!-- Forehead highlight -->
  <ellipse cx="340" cy="203" rx="33" ry="14" transform="rotate(31 340 203)" fill="#909bd1"/>

  <!-- Face -->
  <ellipse cx="183" cy="310" rx="16" ry="37" fill="url(#cyan)"/>
  <ellipse cx="329" cy="310" rx="16" ry="37" fill="url(#cyan)"/>
  <path d="M237 347C245 357 253 358 261 348C269 358 277 357 285 347"
        fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
