  <!-- Face -->
  <ellipse cx="183" cy="310" rx="16" ry="37" fill="url(#cyan)"/>
  <ellipse cx="329" cy="310" rx="16" ry="37" fill="url(#cyan)"/>
  <path d="M237 347C245 357 253 358 261 348C269 358 277 357 285 347"
