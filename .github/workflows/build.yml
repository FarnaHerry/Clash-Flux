# build.yml — Clash-Flux 多平台 CI 矩阵（Linux / Windows / macOS + Android）。
#
# 形态蓝本：姊妹项目 apitab 的 .github/workflows/build.yml（已跑通的 HuxerUI +
# C++23 modules + import std 解法），按本仓库适配（无 sweetedit、目标名
# clash-flux、configure 期自动下载 mihomo 内核）。命名格式与 apitab 一致：
# build-<os>-<arch>（linux-x86_64 / windows-arm64 / macos-arm64 ...）。
#
# 覆盖面原则：**mihomo 内核发布什么桌面平台/arch，就构建什么目标**（内核资产
# 表见 cmake/mihomo_bundle.cmake，SHA256 钉死）。HuxerUI 桌面壳实际能编的目标
# 是 linux/windows/macos × x86_64/arm64 六项，全部入矩阵；内核还发布
# riscv64/loong64/freebsd 等资产，壳编不到的目标暂不入矩阵。
#
# HuxerUI SDK 来源假设（关键）：
#   * 上游 https://github.com/HuxerUI/HuxerUI.git 公开可匿名 clone —— 三个桌面
#     job 全部走「源码通道」：把上游钉在 env.HUXERUI_COMMIT clone 到
#     third_party/huxerui/（该路径已 gitignore，不入库），由顶层 CMakeLists 的
#     优先级 2 add_subdirectory 编译，与本机开发形态一致。
#   * 宿主工具 hcg/hrc 用上游源码内预置（tools/prebuilt/<platform>/<arch>）：
#     钉住的 commit 含 "refresh prebuilt host tools"，预置与源码同步；
#     若未来升级 commit 后出现 hrc 报 "unknown path operation"，即预置落后，
#     需按 apitab CI 的方式在 job 内从 tools/codegen + tools/resource_compiler
#     重编宿主工具（参考 apitab build.yml 的 "Build HuxerUI host tools" 步骤）。
#   * 仓库自带离线 tarball（third_party/tarballs/huxerui-sdk-0.3.0-linux-x86_64）
#     只在源码缺失时兜底，CI 不走它（Linux 桌面 job 装了 gtk4/epoxy/libsoup 开发包，
#     不会触发回落）；android job 只复用 tarball 里的 huxerui CLI，原生框架与
#     项目使用同一提交的源码，避免 SDK 头文件与源码 API 漂移。
#
# 实验性 job（continue-on-error: true）及原因：
#   * build-linux-arm64：ubuntu-24.04-arm 原生 runner + ubuntu:24.04 容器，
#     配方与 x86_64 完全相同，但 arm64 runner 的 LLVM 源仓库可用性未经首跑验证；
#     连续绿后摘掉 continue-on-error。
#
# Windows、macOS 和 Android 已纳入发布门禁：完整 Release 构建或 smoke test
# 失败时，workflow 失败，不会进入发布 job。Android 使用 AndroidLegacy.cmake
# 兼容层绕开 NDK 的 C++ modules/import std 限制；mihomo 也无官方 Android 资产，
# 因此产出包当前只提供 GUI/native shell，内核接入是后续里程碑。
#
# 已知风险：
#   * apt.llvm.org 的 clang-21/libc++-21 包名或 Ubuntu 24.04 的仓库配置若调整需同步改。
#   * `import std` 依赖 pip 固定的 cmake==4.4.2（CxxImportStdGate.cmake 的 UUID
#     表覆盖 3.30–4.4）；升级 CMake 时先查 gate 文件是否已支持新版本。
#   * configure 期从 GitHub releases 下载 mihomo（SHA256 钉死），GitHub 资产
#     不可用会让 Linux job 在 configure 阶段失败。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUXERUI_REPO: 'https://github.com/HuxerUI/HuxerUI.git'
  # 与本机 third_party/huxerui checkout 一致（该目录 gitignore，不入库，
  # CI 必须自行 clone 并钉 commit，保证可复现）。上游活跃开发中，追新时
  # 同步更新本机 checkout 与此 pin。
  HUXERUI_COMMIT: 'd1d2daa154200ff293e556244a5bbf98011602bb'

jobs:
  # ------------------------------------------------------------------ Linux
  # 工具链照搬 apitab 实证配方：ubuntu:24.04 容器 + apt.llvm.org 的
  # clang-21/libc++-21。24.04 是 Linux 发布包的 glibc 基线；不能用 26.04
  # 构建，否则 RPM 会要求 GLIBC_2.43，旧版 Fedora/aarch64 无法安装。
  # 为什么不是 GCC：CMake 的 GNU import-std 发现要 4.0+ 且依赖 GCC ≥15 的
  # libstdc++.modules.json；apitab 实测 GCC 15 对 vendored 模块包装器报
  # "exposes TU-local entity"（GCC 16 才放宽，而 Ubuntu 的 g++-16 快照会 ICE），
  # clang+libc++ 全链最稳。libc++-21-dev 自带 std 模块与
  # modules.json，但 Debian 打包的相对路径是坏的，下面按 llvm-21 前缀改写。
  # arm64 用 ubuntu-24.04-arm 原生 runner（容器同配方，无交叉编译）。
  build-linux:
    name: build-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            experimental: false
          - arch: arm64
            runner: ubuntu-24.04-arm
            experimental: true   # 首跑验证 noble arm64 LLVM 源后摘掉
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Install container baseline
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor --yes -o /etc/apt/keyrings/llvm.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update

      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"

      - name: Install dependencies
        run: |
          apt-get install -y --no-install-recommends \
            clang-21 libc++-21-dev g++ ninja-build pkg-config file binutils gzip \
            python3 python3-pip libssl-dev patchelf \
            libgtk-4-dev libepoxy-dev libsoup-3.0-dev dpkg-dev rpm
          # Ubuntu 24.04 的 apt cmake/clang 版本不满足 import-std，固定 CMake
          # 并从 apt.llvm.org 安装 LLVM 21。
          python3 -m pip install --break-system-packages -q cmake==4.4.2
          cmake --version | head -1
          # Debian 打包的 libc++.modules.json 相对路径坏指 /lib/share/...，
          # 按 /usr/lib/llvm-21 的真实布局改写为绝对路径（arch 目录随主机变）
          python3 -c "
          import glob, json
          p = glob.glob('/usr/lib/*-linux-gnu/libc++.modules.json')[0]
          d = json.load(open(p))
          for m in d['modules']:
              m['source-path'] = '/usr/lib/llvm-21/share/libc++/v1/' + m['source-path'].split('/')[-1]
              m['local-arguments']['system-include-directories'] = ['/usr/lib/llvm-21/share/libc++/v1']
          json.dump(d, open(p, 'w'), indent=1)"

      - name: Configure
        run: |
          # 源码通道：third_party/huxerui 存在且 gtk4/epoxy/libsoup 已装 →
          # 顶层 CMakeLists 优先级 2 自动 add_subdirectory 编译 HuxerUI。
          # configure 期同时下载 mihomo（按本机 arch 选资产，
          # CLASHFLUX_BUNDLE_MIHOMO=ON）。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_SHARED_LINKER_FLAGS='-stdlib=libc++'

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Stage runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-src/lib
          cp build/clash-flux dist-src/clash-flux
          chmod +x dist-src/clash-flux
          # HuxerUI 资源包（resources.bin 索引 + 同目录 .huxv/.png payload），
          # POST_BUILD 已拷到 exe 旁边。
          cp -a build/clash-flux.resources dist-src/
          # mihomo 内核（configure 期下载、POST_BUILD 拷到 <exe>/engines/）
          cp -a build/engines dist-src/
          test -x dist-src/engines/mihomo
          # 源码通道的 libhuxerui.so 在构建树里，随包带出
          huxerui_so="$(find build/huxerui-sdk -name 'libhuxerui.so*' -print -quit)"
          test -n "$huxerui_so"
          cp -L "$huxerui_so" dist-src/lib/libhuxerui.so
          # clang+libc++ 工具链：libc++/libc++abi/libunwind 多数发行版不预装，随包带出
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            p="$(find /usr/lib -name "$lib" -print -quit 2>/dev/null || true)"
            if [ -n "$p" ]; then cp -L "$p" "dist-src/lib/$lib"; fi
          done
          patchelf --set-rpath '$ORIGIN/lib' dist-src/clash-flux
          file dist-src/clash-flux
          ls -la dist-src dist-src/lib dist-src/engines

      - name: Package Linux DEB and RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-packages
          cpack --config build/CPackConfig.cmake -G DEB -B dist-packages
          cpack --config build/CPackConfig.cmake -G RPM -B dist-packages
          packages=(dist-packages/*.deb dist-packages/*.rpm)
          test "${#packages[@]}" -eq 2
          cp "${packages[@]}" dist-src/
          ls -lh dist-src/*.deb dist-src/*.rpm
          expected_rpm_arch="${{ matrix.arch }}"
          [[ "$expected_rpm_arch" == "arm64" ]] && expected_rpm_arch="aarch64"
          rpm_files=(dist-packages/*.rpm)
          test "${#rpm_files[@]}" -eq 1
          rpm_arch="$(rpm -qp --qf '%{ARCH}' "${rpm_files[0]}")"
          test "$rpm_arch" = "$expected_rpm_arch"
          elf_info="$(file dist-src/clash-flux)"
          if [[ "$expected_rpm_arch" == "aarch64" ]]; then
            [[ "$elf_info" == *"ARM aarch64"* ]]
          else
            [[ "$elf_info" == *"x86-64"* ]]
          fi
          # Keep the executable runnable on the supported Fedora/RHEL-era
          # baseline. A newer build image must not silently raise glibc.
          if readelf --version-info dist-src/clash-flux \
              | grep -Eq 'GLIBC_2\.(4[0-9]|[5-9][0-9])'; then
            echo 'Linux package requires newer than GLIBC_2.39' >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- Windows
  # 发布门禁：Windows Release 必须完整通过。
  # 工具链沿用 apitab 实证：MSVC（VS2022，C++23 模块 + import std）。
  # OpenSSL：x86_64 用 choco 包；arm64（windows-11-arm 原生 runner）choco 无
  # arm64 包，用 runner 自带 vcpkg 装 openssl:arm64-windows（动态triplet，
  # DLL 在打包步骤一并带出）。HuxerUI 源码通道同 Linux。
  build-windows:
    name: build-windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
        # arm64 已移除：上游无 windows/arm64 预置 hcg/hrc，本项目也不发布
        # Windows ARM 包（vcpkg openssl:arm64 通道验证成本高，不再支持）。
    continue-on-error: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"

      - name: Ensure CMake >= 4.4 and Ninja
        shell: pwsh
        run: |
          # import std 的 experimental UUID 门控要求 CMake ≥ 4.4
          # （cmake/CxxImportStdGate.cmake）；runner 自带版本不够时 pip 补齐。
          python -m pip install --quiet "cmake==4.4.2"
          cmake --version | Select-Object -First 1
          choco install ninja -y --no-progress

      - name: Install OpenSSL (choco)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install openssl -y --no-progress
          Write-Host "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # HuxerUI 的 Windows 安装器通过 WiX 5 生成 MSI + Burn setup.exe。
          # CMake 配置阶段会按固定 SHA256 下载 WiX 依赖到此缓存目录。
          $wixRoot = Join-Path (Get-Location) '.huxerui/package/windows/dependencies/wix'
          New-Item -ItemType Directory -Force $wixRoot | Out-Null
          dotnet --list-runtimes
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" `
            '-DHUXERUI_PACKAGE=ON' `
            "-DHUXERUI_WIX_ROOT=$wixRoot"

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Package HuxerUI Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Native([string] $File, [string[]] $Arguments) {
            & $File @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$File exited with code $LASTEXITCODE"
            }
          }

          $cmake = (Get-Command cmake).Path
          $projectRoot = (Get-Location).Path
          $planPath = Join-Path $projectRoot 'build/huxerui-package/windows/Release/package.json'
          if (-not (Test-Path $planPath -PathType Leaf)) {
            throw "HuxerUI Windows package plan not found: $planPath"
          }
          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          $installerPlanPath = [string]$plan.installerPlan
          if (-not (Test-Path $installerPlanPath -PathType Leaf)) {
            throw "HuxerUI installer integration plan not found: $installerPlanPath"
          }
          $installerPlan = Get-Content $installerPlanPath -Raw | ConvertFrom-Json

          # Keep the layout identical to `huxerui package windows`; the setup.exe
          # is the release artifact and embeds the staged MSI plus installer UI.
          $packageRoot = Join-Path $projectRoot '.huxerui/package/windows/release'
          $staging = Join-Path $packageRoot 'staging'
          $installerStaging = Join-Path $packageRoot 'installer'
          $projectShell = Join-Path $projectRoot 'platform/windows'
          $msi = Join-Path $packageRoot "$($plan.target).msi"
          $payloads = Join-Path $packageRoot 'installer-payloads.wxs'
          $bundle = Join-Path $packageRoot "$($plan.target)-Setup-$($plan.version).exe"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Invoke-Native $cmake @('-E', 'rm', '-rf', $staging)
          Invoke-Native $cmake @('-E', 'rm', '-rf', $installerStaging)
          Invoke-Native $cmake @('-E', 'make_directory', $staging)
          Invoke-Native $cmake @('-E', 'make_directory', $installerStaging)

          # CMake runtime scanner 的搜索根包含 build/；先把当前 OpenSSL
          # 安装中的 DLL 放进去，保证 libssl/libcrypto 会被解析并部署到
          # 免安装目录与 MSI，而不是依赖 runner 的 PATH。
          $opensslExecutable = (Get-Command openssl.exe -ErrorAction Stop).Source
          $opensslBin = Split-Path -Parent $opensslExecutable
          foreach ($pattern in @('libssl-*.dll', 'libcrypto-*.dll')) {
            $dlls = @(Get-ChildItem $opensslBin -File -Filter $pattern)
            if ($dlls.Count -eq 0) { throw "OpenSSL runtime DLL is missing: $opensslBin\$pattern" }
            Copy-Item $dlls.FullName build -Force
          }

          Invoke-Native $cmake @('--install', 'build', '--config', 'Release', '--component',
            [string]$plan.installComponent, '--prefix', $staging)
          Invoke-Native $cmake @('--install', 'build', '--config', 'Release', '--component',
            [string]$installerPlan.installComponent, '--prefix', $installerStaging)

          $wix = [string]$installerPlan.wix
          Invoke-Native $wix @('build', [string]$plan.packageSource, '-arch', 'x64',
            '-bindpath', "Application=$staging", '-bindpath', "Project=$projectShell", '-out', $msi)

          $payloadScript = Join-Path $projectRoot 'third_party/huxerui/cmake/HuxerUIGenerateWixPayloads.cmake'
          Invoke-Native $cmake @("-DHUXERUI_WIX_PAYLOAD_DIRECTORY=$installerStaging",
            "-DHUXERUI_WIX_PAYLOAD_EXECUTABLE=$([string]$installerPlan.installer)",
            "-DHUXERUI_WIX_PAYLOAD_OUTPUT=$payloads", '-P', $payloadScript)
          if ((Get-Content $payloads -Raw) -notmatch 'mbanative\.dll') {
            throw 'HuxerUI installer payload is missing mbanative.dll'
          }

          Invoke-Native $wix @('build', [string]$plan.bundleSource, $payloads, '-arch', 'x64',
            '-bindpath', "Installer=$installerStaging", '-bindpath', "Package=$packageRoot",
            '-bindpath', "Project=$projectShell", '-out', $bundle)
          if (-not (Test-Path $bundle -PathType Leaf)) {
            throw "HuxerUI setup.exe was not produced: $bundle"
          }
          New-Item -ItemType Directory -Force dist-src | Out-Null
          Copy-Item $bundle (Join-Path 'dist-src' ([IO.Path]::GetFileName($bundle))) -Force
          Get-Item $bundle

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 复用 CMake install 生成的完整运行目录，不能只复制 exe。
          $staging = '.huxerui/package/windows/release/staging'
          $exe = Join-Path $staging 'clash-flux.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "$exe not found" }
          New-Item -ItemType Directory -Force dist-src | Out-Null
          Copy-Item (Join-Path $staging '*') dist-src -Recurse -Force
          foreach ($file in @('clash-flux.exe', 'huxerui.dll')) {
            if (-not (Test-Path (Join-Path 'dist-src' $file) -PathType Leaf)) {
              throw "Windows runtime payload is missing: $file"
            }
          }
          foreach ($pattern in @('libssl-*.dll', 'libcrypto-*.dll')) {
            if (-not (Get-ChildItem 'dist-src' -File -Filter $pattern)) {
              throw "Windows runtime payload is missing: $pattern"
            }
          }
          Get-Item dist-src/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.arch }}
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ macOS
  # 发布门禁：macOS Release 必须完整通过。
  # 工具链沿用 apitab 实证：整链 brew LLVM clang/libc++（.mm 框架层只能 clang
  # 编，std 类型贯穿 .mm/.cpp 接口必须单一标准库；AppleClang 不被 CMake 的
  # C++20 模块扫描支持）。brew llvm 不带 libc++.modules.json，按上游 schema
  # 生成。上游 window.h 的 CrossAlign(...) 函数式转型依赖 P0960（clang 的
  # ObjC++ 模式未实现），CI 内联打补丁（仓库不持有 cmake/patches）。
  # arm64 用 macos-15（Apple Silicon），x86_64 用 macos-13（Intel）；
  # OpenSSL 前缀随 Homebrew 前缀变（/opt/homebrew vs /usr/local）。
  build-macos:
    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
        # x86_64 已移除：macos-13（Intel）runner 已退役，job 永远排队阻塞；
        # 在 arm runner 上交叉编译 x86_64 又卡在「没有 x86_64 的 OpenSSL 产物」
        # （brew 只有 arm64 库）。darwin amd64 的 mihomo 资产表保留，供发布
        # 打包；Intel 构建等有 x86_64 OpenSSL 产物后再补。
    continue-on-error: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI source (pinned) + P0960 patch
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$HUXERUI_REPO" third_party/huxerui
          git -C third_party/huxerui checkout "$HUXERUI_COMMIT"
          # P0960 聚合函数式转型 → 花括号初始化（clang ObjC++ 不支持 P0960；
          # 上游 window.h 在钉住的 commit 仍未修）。补丁内容与 apitab 的
          # cmake/patches/huxerui-window-p0960.patch 一致，NOTE 标注同步改。
          git -C third_party/huxerui apply <<'PATCH'
          diff --git a/include/huxerui/window.h b/include/huxerui/window.h
          index f172894..72c6476 100644
          --- a/include/huxerui/window.h
          +++ b/include/huxerui/window.h
          @@ -249,7 +249,12 @@ class WindowTitleBar final : public Layout<WindowTitleBar> {
           public:
             /// Constructs a title bar from an existing child collection.
             explicit WindowTitleBar(std::vector<View> children) : Layout(std::move(children)) {
          -    this->ApplyModifiers(WindowDragRegion{}, CrossAlign(CrossAxisAlignment::Center));
          +    // NOTE(clash-flux CI patch): functional-style cast to the CrossAlign
          +    // aggregate relies on P0960, which clang does not implement in Objective-C++
          +    // mode — every appkit *.mm TU failed to compile on macOS ("no matching
          +    // conversion for functional-style cast"). Brace initialization works in all
          +    // languages/compilers. Suggest upstream adopt CrossAlign{...} here.
          +    this->ApplyModifiers(WindowDragRegion{}, CrossAlign{CrossAxisAlignment::Center});
             }

             /// Constructs a title bar from ordinary View children.
          PATCH

      - name: Install dependencies (brew llvm + openssl)
        run: |
          brew list openssl@3 &>/dev/null || brew install openssl@3
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          mod_dir="$llvm_prefix/share/libc++/v1"
          # brew llvm 只装模块源不带 libc++.modules.json（formula 未开
          # LIBCXX_ENABLE_STD_MODULES）——按上游 schema 生成一份，写进 brew
          # 的 lib/ 使 -print-file-name 发现路径命中。
          for f in std.cppm std.compat.cppm; do
            test -f "$mod_dir/$f" || { echo "missing $mod_dir/$f (brew llvm layout changed?)" >&2; exit 1; }
          done
          python3 - "$mod_dir" "$llvm_prefix/lib/libc++.modules.json" <<'PY'
          import json, sys
          mod_dir, out = sys.argv[1], sys.argv[2]
          mod = lambda name: {"logical-name": name, "source-path": mod_dir + "/" + name + ".cppm", "is-std-library": True, "local-arguments": {"system-include-directories": [mod_dir]}}
          json.dump({"version": 1, "revision": 1, "modules": [mod("std"), mod("std.compat")]}, open(out, "w"), indent=1)
          PY
          echo "LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          # Homebrew 前缀随 arch 变（arm64=/opt/homebrew，x86_64=/usr/local）
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Configure
        run: |
          set -euo pipefail
          # 要点（apitab 实证）：OBJCXX 必须显式指定 brew clang，否则 CMake
          # 默认拿 xcrun 的 AppleClang 混回两套 libc++；链接行按 brew llvm
          # caveats 配方（libc++/libc++abi 在 lib/c++，libunwind 在 lib/unwind，
          # -L 指错会落到 SDK 系统 libc++ tbd 报 undefined symbol）；
          # _LIBCPP_DISABLE_AVAILABILITY 关闭针对系统 dylib 的假可用性标注
          # （本链链 brew 自带 dylib）；CMAKE_CXX_STDLIB_MODULES_JSON 显式注入
          # 上一步生成的元数据。部署目标 14.0（框架已用 macOS 14 API）。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_OBJCXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++ -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="$LLVM_PREFIX/lib/libc++.modules.json" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Stage app bundle
        run: |
          set -euo pipefail
          # huxerui_add_app 在 APPLE 上产 .app bundle；自带内核在 bundle 旁
          # 的 engines/（POST_BUILD 拷到 exe 所在目录）
          test -d build/clash-flux.app
          mkdir -p dist-src
          cp -a build/clash-flux.app dist-src/
          if [ -d build/engines ]; then cp -a build/engines dist-src/; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.arch }}
          path: dist-src
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- Android
  # Android 发布门禁：验证 GUI/native shell 能否经 HuxerUI CLI 编出 APK。
  # mihomo 官方没有 Android 资产，安卓内核接入是后续里程碑——产出的包不含
  # 内核、不可实际代理。
  # CLI 来源：仓库自带 Linux 离线 SDK tarball（bin/huxerui）；框架源码与桌面
  # job 使用同一 HUXERUI_COMMIT，Android Gradle 从该源码构建 HuxerUI。
  build-android:
    name: build-android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure CMake >= 3.31 (pip) and expose to Gradle
        run: |
          set -euo pipefail
          # SDK 自带的 3.22.1 不够，AGP 也不会自动装 3.31.1 —— 直接 pip 装
          # 3.31.6，经用户级 gradle
          # 属性 cmake.dir 指给 AGP（不进仓库）。
          python3 -m pip install --break-system-packages -q cmake==3.31.6
          cmake_root="$(dirname "$(dirname "$(command -v cmake)")")"
          "$cmake_root/bin/cmake" --version | head -1
          # 诊断：SDK 里有哪些 cmake 版本（PATH 搜索失败时的备选）。
          (yes | sdkmanager --list 2>/dev/null | grep -i "cmake;" | head -5) || true
          # AGP 读 cmake.dir：setup-android 会重定向 GRADLE_USER_HOME，用户级
          # gradle.properties 可能被绕过 —— 项目级（必读）+ 用户级双写兜底。
          # 项目文件改动只存在于本 job，不进仓库。
          echo "cmake.dir=$cmake_root" >> platform/android/gradle.properties
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          echo "cmake.dir=$cmake_root" >> "$gradle_home/gradle.properties"

      - name: Prepare HuxerUI CLI and source
        run: |
          set -euo pipefail
          mkdir -p huxerui-sdk
          tar -xzf third_party/tarballs/huxerui-sdk-0.3.0-linux-x86_64.tar.gz \
            -C huxerui-sdk --strip-components=1
          test -x huxerui-sdk/bin/huxerui
          git clone --filter=blob:none "$HUXERUI_REPO" huxerui-source
          git -C huxerui-source checkout "$HUXERUI_COMMIT"
          test -f huxerui-source/CMakeLists.txt
          test -f huxerui-source/platform/android/huxerui/build.gradle
          echo "HUXERUI_HOME=$PWD/huxerui-sdk" >> "$GITHUB_ENV"
          echo "$PWD/huxerui-sdk/bin" >> "$GITHUB_PATH"
          huxerui-sdk/bin/huxerui --version

      - name: Configure Android release signing
        env:
          CLASHFLUX_ANDROID_KEYSTORE_BASE64: ${{ secrets.CLASHFLUX_ANDROID_KEYSTORE_BASE64 }}
          CLASHFLUX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLASHFLUX_ANDROID_KEYSTORE_PASSWORD }}
          CLASHFLUX_ANDROID_KEY_ALIAS: ${{ secrets.CLASHFLUX_ANDROID_KEY_ALIAS }}
          CLASHFLUX_ANDROID_KEY_PASSWORD: ${{ secrets.CLASHFLUX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLASHFLUX_ANDROID_KEYSTORE_BASE64"
          test -n "$CLASHFLUX_ANDROID_KEYSTORE_PASSWORD"
          test -n "$CLASHFLUX_ANDROID_KEY_ALIAS"
          test -n "$CLASHFLUX_ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/clash-flux-release.jks"
          printf '%s' "$CLASHFLUX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          {
            echo "ORG_GRADLE_PROJECT_clashfluxReleaseKeystoreFile=$keystore"
            echo "ORG_GRADLE_PROJECT_clashfluxReleaseKeystorePassword=$CLASHFLUX_ANDROID_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_clashfluxReleaseKeyAlias=$CLASHFLUX_ANDROID_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_clashfluxReleaseKeyPassword=$CLASHFLUX_ANDROID_KEY_PASSWORD"
            echo 'ORG_GRADLE_PROJECT_clashfluxRequireReleaseSigning=true'
          } >> "$GITHUB_ENV"

      - name: Build Android package (GUI/native shell, no mihomo kernel)
        run: |
          set -euo pipefail
          huxerui build android --source huxerui-source --profile release

      - name: Stage Android artifact
        run: |
          set -euo pipefail
          mkdir -p dist-src
          apk="$(find platform/android/app/build -type f -path '*/outputs/apk/release/*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist-src/clash-flux-android-universal.apk
          test -s dist-src/clash-flux-android-universal.apk
          ls -lh dist-src

      - name: Verify Android APK signature
        run: |
          set -euo pipefail
          apk="dist-src/clash-flux-android-universal.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Smoke test Android launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r dist-src/clash-flux-android-universal.apk
            adb logcat -c
            adb shell am start -n dev.farna.clashflux/.MainActivity
            sleep 12
            adb logcat -d -v threadtime > android-launch.log
            cat android-launch.log
            if grep -Eq 'FATAL EXCEPTION|Fatal signal|Abort message|Process: dev\.farna\.clashflux|RuntimeException' android-launch.log; then
              echo "Android launch produced a fatal log entry" >&2
              exit 1
            fi
            pid="$(adb shell pidof dev.farna.clashflux | tr -d '\r')"
            test -n "$pid"
            adb shell am force-stop dev.farna.clashflux

      - name: Upload Android launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-log
          path: android-launch.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------- Release
  # 只有 v* 标签触发此 job。各平台构建全部通过后，将 artifact 打成归档并
  # 发布到对应 GitHub Release，避免出现“Release 已发布但没有可下载产物”。
  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: false

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          release_version="${GITHUB_REF_NAME#v}"
          test "$release_version" != "$GITHUB_REF_NAME"
          for artifact in dist/build-*; do
            name="$(basename "$artifact")"
            if [ "$name" = "build-windows-x86_64" ]; then
              setup_exe="$(find "$artifact" -maxdepth 1 -type f -name '*-Setup-*.exe' -print -quit)"
              test -n "$setup_exe"
              cp "$setup_exe" "release/clash-flux-${release_version}-windows-x86_64-setup.exe"
              (
                cd "$artifact"
                zip -qr "$GITHUB_WORKSPACE/release/clash-flux-${release_version}-windows-x86_64.zip" . \
                  -x '*-Setup-*.exe'
              )
            elif [[ "$name" == build-linux-* ]]; then
              arch="${name#build-linux-}"
              [[ "$arch" == "arm64" ]] && arch="aarch64"
              tar -C dist -czf "release/clash-flux-${release_version}-linux-${arch}.tar.gz" "$name"
              shopt -s nullglob
              for extension in deb rpm; do
                packages=("$artifact"/*."$extension")
                test "${#packages[@]}" -eq 1
                cp "${packages[0]}" "release/clash-flux-${release_version}-linux-${arch}.${extension}"
              done
            elif [[ "$name" == build-macos-* ]]; then
              arch="${name#build-macos-}"
              tar -C dist -czf "release/clash-flux-${release_version}-macos-${arch}.tar.gz" "$name"
            elif [ "$name" = "build-android" ]; then
              apk="$(find "$artifact" -maxdepth 1 -type f -name '*.apk' -print -quit)"
              test -n "$apk"
              cp "$apk" "release/clash-flux-${release_version}-android-universal.apk"
            else
              echo "Unsupported build artifact: $name" >&2
              exit 1
            fi
          done
          test -s "release/clash-flux-${release_version}-windows-x86_64-setup.exe"
          test -s "release/clash-flux-${release_version}-windows-x86_64.zip"
          test -s "release/clash-flux-${release_version}-android-universal.apk"
          test -n "$(find release -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find release -type f -name '*.deb' -print -quit)"
          test -n "$(find release -type f -name '*.rpm' -print -quit)"
          ls -lh release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clash-Flux $GITHUB_REF_NAME" \
            --generate-notes \
            release/*
